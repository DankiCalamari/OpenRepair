{% extends "base.html" %}
{% block title %}{{ tr('Editar') }} {{ cliente.nombre }} — OpenRepair{% endblock %}

{% block content %}
<h1>{{ tr('Editar cliente') }}</h1>

<div class="card">
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="nombre">{{ tr('Nombre *') }}</label>
            <input type="text" id="nombre" name="nombre" value="{{ cliente.nombre }}" required>
        </div>

        <div class="form-group">
            <label for="telefono">{{ tr('Teléfono') }}</label>
            <input type="tel" id="telefono" name="telefono" value="{{ cliente.telefono or '' }}">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ cliente.email or '' }}">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ tr('Guardar cambios') }}</button>
            <a href="{{ url_for('detalle_cliente', id=cliente.id) }}" class="btn btn-secondary">{{ tr('Cancelar') }}</a>
        </div>
    </form>
</div>
{% endblock %}
