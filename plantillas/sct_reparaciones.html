{% extends "base.html" %}
{% from "_macros.html" import badge_estado %}
{% block title %}Reparaciones · SCT{% endblock %}
{% block content %}<header class="page-header"><div><span class="panel-eyebrow">SCT / WORKSHOP</span><h1>Reparaciones</h1><p class="page-intro-sub">Flujo operativo del taller · {{ total }} trabajos registrados</p></div><a href="{{ url_for('sct_nueva_reparacion') }}" class="btn btn-primary">+ Nueva reparación</a></header><section class="panel"><form class="search-bar" method="get"><input name="q" value="{{ q }}" placeholder="Buscar número, cliente, teléfono o dispositivo" aria-label="Buscar reparaciones"><select name="estado"><option value="">Todos los estados</option>{% for estado in estados %}<option value="{{ estado }}" {% if estado == estado_actual %}selected{% endif %}>{{ estado }}</option>{% endfor %}<button class="btn btn-secondary" type="submit">Filtrar</button></form></section><div class="table-responsive"><table><thead><tr><th>Reparación</th><th>Cliente</th><th>Dispositivo</th><th>Prioridad</th><th>Estado</th><th>Entrada</th></tr></thead><tbody>{% for rep in reparaciones %}<tr><td><a href="{{ url_for('detalle_reparacion', codigo=rep.codigo) }}">{{ rep.codigo }}</a></td><td><strong>{{ rep.cliente_nombre }} {{ rep.apellido or '' }}</strong><br><span class="text-muted">{{ rep.telefono or rep.email or '' }}</span></td><td>{{ rep.marca or '' }} {{ rep.modelo or '' }}<br><span class="text-muted">{{ rep.categoria_dispositivo or rep.tipo_dispositivo }}</span></td><td><span class="priority priority-{{ rep.prioridad }}">{{ rep.prioridad|capitalize }}</span></td><td>{{ badge_estado(rep.estado) }}</td><td>{{ rep.created_at.strftime('%d/%m/%Y') }}</td></tr>{% else %}<tr><td colspan="6" class="empty-state">No hay reparaciones que coincidan.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
